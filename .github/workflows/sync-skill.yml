name: Sync Skill to Skill Repo

on:
  push:
    branches: [master, main]
    paths:
      - 'skill/SKILL.md'

jobs:
  sync-skill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4

      - name: Checkout skill repo
        uses: actions/checkout@v4
        with:
          repository: mhrsntrk/ask-master-skill
          token: ${{ secrets.SKILL_REPO_PAT }}
          path: ask-master-skill

      - name: Sync SKILL.md
        run: |
          cp skill/SKILL.md ask-master-skill/SKILL.md
          cd ask-master-skill
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add SKILL.md
          git diff --cached --quiet || git commit -m "sync: update SKILL.md from ask-master@${{ github.sha }}"
          git push
